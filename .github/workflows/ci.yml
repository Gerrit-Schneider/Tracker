name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Java-Backend
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Java einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend-java/pom.xml

      - name: Backend testen
        working-directory: backend-java
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode clean test

  analytics:
    name: Python-Analytics
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Abhängigkeiten installieren
        working-directory: analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Analytics testen
        working-directory: analytics
        run: python -m pytest

  frontend:
    name: TypeScript-Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend-typescript/package-lock.json

      - name: Abhängigkeiten installieren
        working-directory: frontend-typescript
        run: npm ci

      - name: Frontend bauen
        working-directory: frontend-typescript
        run: npm run build