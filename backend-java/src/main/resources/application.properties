spring.application.name=PeakProgress

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/peakprogress}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:peakprogress}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:peakprogress_dev}

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info